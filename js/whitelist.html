<!-- أضف هذا داخل الـ <body> في ملف whitelist.html -->

<div class="container">
    <!-- قسم التحميل (يظهر في البداية حتى نتأكد من حالة المستخدم) -->
    <div id="loading-section" class="text-center">
        <h2>جاري التحميل...</h2>
    </div>

    <!-- قسم التسجيل مغلق -->
    <div id="closed-section" style="display: none;" class="alert-box">
        <h2>عذراً، التسجيل مغلق حالياً!</h2>
        <p>يرجى المحاولة في وقت لاحق.</p>
    </div>

    <!-- قسم حالة الطلب (إذا كان قد قدم طلباً مسبقاً) -->
    <div id="status-section" style="display: none;" class="status-box">
        <h2>حالة طلبك: <span id="application-status"></span></h2>
        <div id="reject-reason-box" style="display: none;">
            <h3>سبب الرفض:</h3>
            <p id="reject-reason-text"></p>
        </div>
    </div>

    <!-- نموذج التقديم -->
    <form id="whitelist-form" style="display: none;">
        <h2>تقديم طلب Whitelist</h2>
        
        <label>الاسم الكامل داخل اللعبة (Full Name In Game)</label>
        <input type="text" id="fullname" required>

        <label>الآيدي داخل اللعبة (Player ID)</label>
        <input type="text" id="player_id" required>

        <label>الديسكورد (Discord)</label>
        <input type="text" id="discord" required>

        <label>العمر (Age)</label>
        <input type="number" id="age" min="14" max="100" required>

        <label>قصة الشخصية</label>
        <textarea id="story" rows="5" placeholder="اكتب قصة شخصيتك هنا..." required></textarea>

        <label>لماذا تريد دخول السيرفر؟</label>
        <textarea id="reason" rows="4" required></textarea>

        <label>خبرتك في RP</label>
        <textarea id="experience" rows="4" required></textarea>

        <div class="checkbox-group">
            <input type="checkbox" id="rules" required>
            <label for="rules">لقد قرأت قوانين السيرفر وأوافق عليها</label>
        </div>

        <button type="submit" id="submit-btn">إرسال الطلب</button>
        <p id="form-error" class="error-msg" style="display:none;"></p>
    </form>
</div>

<script type="module" src="js/whitelist.js"></script>
